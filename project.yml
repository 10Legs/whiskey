name: WhisKey
options:
  bundleIdPrefix: com.rdemeritt
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

packages:
  WhisKeyLocalSPM:
    path: "."

targets:
  WhisKey:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisKeyApp
        excludes:
          - Info.plist
      - path: Sources/WhisKeyApp/PrivacyInfo.xcprivacy
      - path: Sources/WhisKeyCore
    dependencies:
      - package: WhisKeyLocalSPM
        product: CWhisper
      - package: WhisKeyLocalSPM
        product: CLlama
      - framework: Accelerate.framework
        implicit: true
      - framework: Carbon.framework
        implicit: true
      - framework: Metal.framework
        implicit: true
      - framework: MetalKit.framework
        implicit: true
      - framework: CoreML.framework
        implicit: true
      - sdk: ApplicationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rdemeritt.whiskey
        INFOPLIST_FILE: Sources/WhisKeyApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhisKey/WhisKey.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: VMYU8579BG
        PRODUCT_NAME: WhisKey
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
        # LSUIElement handled via Info.plist
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: VMYU8579BG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: "wholemodule"
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: VMYU8579BG
    preBuildScripts:
      - name: "Compile ggml-metal.metal → default.metallib"
        script: |
          set -e
          METAL_SRC="${SRCROOT}/CGGML/ggml-metal/ggml-metal.metal"
          AIR="${DERIVED_FILE_DIR}/ggml-metal.air"
          DEST_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST_LIB="${DEST_DIR}/default.metallib"
          mkdir -p "$DEST_DIR"
          xcrun metal -sdk macosx \
            -I "${SRCROOT}/CGGML" \
            -I "${SRCROOT}/CGGML/include" \
            -I "${SRCROOT}/CGGML/ggml-metal" \
            -DGGML_USE_METAL \
            -c "$METAL_SRC" -o "$AIR"
          xcrun metallib "$AIR" -o "$DEST_LIB"
        basedOnDependencyAnalysis: false

    postBuildScripts:
      - name: "Install to ~/Applications"
        script: |
          DEST="$HOME/Applications/$FULL_PRODUCT_NAME"
          echo "Copying $BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME → $DEST"
          rm -rf "$DEST"
          cp -R "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST"
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false

  WhisKeyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WhisKeyCoreTests
    dependencies:
      - target: WhisKey
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhisKey.app/Contents/MacOS/WhisKey"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WhisKey:
    build:
      targets:
        WhisKey: all
        WhisKeyCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhisKeyCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
