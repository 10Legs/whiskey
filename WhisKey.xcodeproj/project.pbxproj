			name = "Copy ggml-metal.metal shader for runtime";
			outputFileListPaths = (
			);
			outputPaths = (
				"${BUILT_PRODUCTS_DIR}/default.metallib",
				"${BUILT_PRODUCTS_DIR}/ggml-metal.metal",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Compile ggml-metal.metal → default.metallib.\n#\n# GGML_METAL_PATH_RESOURCES is set at runtime to BUILT_PRODUCTS_DIR\n# (the flat Debug/ directory) because the WhisKey binary runs from there\n# as a bare SPM executable — _NSGetExecutablePath has no /MacOS/ component.\n# ggml_metal_library_init looks for default.metallib (then ggml-metal.metal)\n# in that directory. Files MUST land in BUILT_PRODUCTS_DIR.\n#\n# We also copy into the .app bundle Resources for signed/distributed builds.\n\nMETAL_SRC=\"${SRCROOT}/CGGML/ggml-metal/ggml-metal.metal\"\nAIR=\"${BUILT_PRODUCTS_DIR}/ggml-metal.air\"\n\n# Attempt precompile (non-fatal)\nif xcrun -sdk macosx metal \\\n     -I\"${SRCROOT}/CGGML/include\" \\\n     -I\"${SRCROOT}/CGGML/ggml-metal\" \\\n     -c \"${METAL_SRC}\" -o \"${AIR}\" 2>/dev/null; then\n  xcrun -sdk macosx metallib \"${AIR}\" \\\n    -o \"${BUILT_PRODUCTS_DIR}/default.metallib\" 2>/dev/null && \\\n    echo \"ggml-metal: compiled → ${BUILT_PRODUCTS_DIR}/default.metallib\"\n  rm -f \"${AIR}\"\nfi\n\n# Always copy source as JIT fallback (used when no .metallib found)\ncp \"${METAL_SRC}\" \"${BUILT_PRODUCTS_DIR}/ggml-metal.metal\"\n\n# Also install into .app bundle Resources if it exists (distribution builds)\nRES_DIR=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources\"\nif [ -d \"${RES_DIR}\" ]; then\n  cp \"${BUILT_PRODUCTS_DIR}/default.metallib\" \"${RES_DIR}/\" 2>/dev/null || true\n  cp \"${METAL_SRC}\" \"${RES_DIR}/ggml-metal.metal\" 2>/dev/null || true\nfi\n";
		};
