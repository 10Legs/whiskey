included:
  - Sources
  - Tests

excluded:
  - Vendor
  - .build
  - CWhisper
  - CLlama
  - CGGML

# Rules that block merges
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

# Analyzer rules run only via `swiftlint analyze`, not `swiftlint lint`.
# unused_import requires the full compiler index and must live here.
analyzer_rules:
  - unused_import

disabled_rules:
  - trailing_whitespace  # editor-enforced

# Thresholds
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - ok
    - db
    - ax
    - rms
    - url

# Force unwrap exemptions for known-safe SDK calls
force_unwrapping: warning

reporter: "github-actions-logging"
